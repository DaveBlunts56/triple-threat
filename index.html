<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triple Threat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
  #court { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; align-items: center;
         padding: 8px 20px; background: rgba(0, 0, 0, .8); border-radius: 10px; font-variant-numeric: tabular-nums; }
  #hud .score { font-size: 28px; font-weight: 700; }
  #hud .home { color: #7fb4ff; }
  #hud .away { color: #ff8f8f; }
  #hud .clock { text-align: center; }
  #gameClock { font-size: 22px; font-weight: 600; }
  #shotClock { color: #ffd257; font-size: 22px; font-weight: 600; }
  #controls, #backend { position: fixed; bottom: 12px; padding: 6px 12px; background: rgba(0, 0, 0, .8); border-radius: 8px; font-size: 13px; }
  #controls { left: 12px; }
  #backend { right: 12px; }
  section.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                   background: rgba(0, 0, 0, .78); text-align: center; }
  section.screen[hidden] { display: none; }
  section.screen h1 { font-size: 56px; margin: 0 0 12px; }
  section.screen p { font-size: 20px; margin: 6px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.webgpu.js",
  "three/webgpu": "./node_modules/three/build/three.webgpu.js",
  "three/tsl": "./node_modules/three/build/three.tsl.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="court"></canvas>

<div id="hud">
  <span class="score home" id="score0">0</span>
  <div class="clock">
    <div><span id="quarter">Q1</span> · <span id="gameClock">3:00</span></div>
    <div id="shotClock">24</div>
  </div>
  <span class="score away" id="score1">0</span>
</div>
<p id="announce" class="sr-only" aria-live="polite"></p>

<div id="controls">WASD move · Shift sprint · Space shoot / jump · E pass / switch · Q steal · Esc pause</div>
<div id="backend"></div>

<section class="screen" id="screenStart" hidden>
  <h1>Triple Threat</h1>
  <p>Press Enter to play</p>
</section>
<section class="screen" id="screenPause" hidden>
  <h1>Paused</h1>
  <p>Press Esc to resume</p>
</section>
<section class="screen" id="screenFinal" hidden>
  <h1 id="finalTitle">Final</h1>
  <p id="finalScore"></p>
  <p>Press Enter to play again</p>
</section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
